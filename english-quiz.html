<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learn to Speak English - Clickable Quiz</title>
<style>
body{margin:0;background:#f2faf5;color:#17372a;font-family:Arial,sans-serif}header{background:#0b593b;color:white;text-align:center;padding:22px 12px}h1{margin:0}.wrap{max-width:780px;margin:16px auto;padding:0 12px}.bar,.card{background:white;padding:16px;margin:12px 0;border-radius:14px;box-shadow:0 3px 12px #1232}.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.qnum{color:#168052;font-weight:bold;font-size:13px}.hi{font-size:20px;font-weight:bold;margin:12px 0}.en{font-weight:bold;margin-bottom:12px}.opts{display:grid;gap:8px}@media(min-width:560px){.opts{grid-template-columns:1fr 1fr}}button{font-size:16px;cursor:pointer}.opt{background:#fbfefc;border:2px solid #d8e7dd;border-radius:10px;padding:12px;text-align:left;line-height:1.4}.opt:hover{border-color:#168052}.correct{background:#dff7e7;border-color:#168052}.wrong{background:#fff0f0;border-color:#c33}.feedback{display:none;margin-top:10px;padding:10px;border-radius:9px}.show{display:block}.good{background:#e5f8eb;color:#145b31}.bad{background:#fff0f0;color:#8d2222}.btn{border:0;background:#104b35;color:white;border-radius:8px;padding:10px 12px;font-weight:bold}footer{text-align:center;padding:18px;color:#5b7065}
</style></head><body><header><h1>📘 Learn to Speak English</h1><p>Daily Spoken English • Click the correct answer</p></header>
<div class="wrap"><div class="bar"><strong id="score">Score: 0 / 10</strong><div><button class="btn" onclick="showAll()">Show answers</button> <button class="btn" onclick="resetQuiz()">Try again</button></div></div><div id="quiz"></div><div class="card" id="result" style="display:none;text-align:center"><h2>🎉 Quiz completed!</h2><p id="resultText"></p><button class="btn" onclick="resetQuiz()">Try again</button></div></div><footer>Practice a little every day. Speak English with confidence!</footer>
<script>
const qs=[
["“आज का दिन बहुत अच्छा रहा।”","Choose the most natural phrase:",["Today was a wonderful day! / I had a great day today.","Day rating is top today.","Happy hours passed today."],0,"Natural: “Today was a wonderful day!” or “I had a great day today.”"],
["“इसे हल्के में मत लो।”","Choose the correct spoken English:",["Don’t take it lightly. / Take it seriously.","No easy thought for this.","Small rating don’t give to this."],0,"“Don’t take it lightly” means किसी बात को हल्के में मत लो."],
["“इसे ज़रा सुखा लो।” (गीले कपड़े या सामान के लिए)","Choose the most natural phrase:",["Make it dry a bit. / Let it dry off.","Water remove fast from this.","Sun touch do on this.","Heat process start for item."],0,"“Let it dry off” or “Let it dry a bit” is natural."],
["“वह बातों का बहुत धनी है / बहुत मीठा बोलता है।”","Choose the best spoken option:",["Sweet sugar comes from his mouth.","Words are soft like honey.","He is a sweet talker."],2,"“He is a sweet talker” means वह मीठी-मीठी बातें करता है."],
["“पापा, मुझे आपसे कुछ बात करनी है।”","Choose the natural English sentence:",["Dad, I talk to you on something.","Father, I need some discussion.","Dad, I need to talk to you about something.","I want speaking to you dad."],2,"“Dad, I need to talk to you about something.”"],
["“मम्मी, मेरी चीज़ें कहाँ रखी हैं?”","Choose the most natural phrase:",["Mom, where have you kept my things?","Mother, my items are at which place?","Where did my things go mom?","Mom, show my keeping things."],0,"“Mom, where have you kept my things?”"],
["“पापा, क्या आप मुझे स्कूल छोड़ देंगे?”","Choose the natural English sentence:",["Father, will you leave me at school?","Dad, can you drop me off at school?","Dad, take me to school vehicle.","Can school drop happen by you dad?"],1,"“Dad, can you drop me off at school?”"],
["“मम्मी, आज खाने में क्या बनाया है?”","Choose the most natural phrase:",["Mom, what have you made for dinner?","Mother, what food is prepared today?","Mom, make something good for eating.","What is cooking in kitchen mom?"],0,"Natural: “Mom, what have you made for dinner?” For lunch, say “...for lunch?”"],
["“क्या तुम्हें इस बारे में पक्का पता है?”","Choose the best spoken option:",["Is this full true for you?","Are you sure about this? / Are you 100% certain?","Mind is clear on this?"],1,"“Are you sure about this?” / “Are you 100% certain?”"],
["“वह हमेशा बहाने बनाता रहता है।”","Choose the best option:",["Reasons are ready with him.","He always makes excuses.","Excuses are his daily work.","He lies everyday to all."],1,"The natural expression is “He always makes excuses.”"]
];
let picked={};const root=document.getElementById("quiz");
function score(){return qs.reduce((s,q,i)=>s+(picked[i]===q[3]?1:0),0)}
function render(){root.innerHTML=qs.map((q,i)=>{let answered=picked[i]!==undefined;let opts=q[2].map((o,j)=>'<button class="opt '+(answered&&j===q[3]?'correct':answered&&picked[i]===j?'wrong':'')+'" onclick="choose('+i+','+j+')" '+(answered?'disabled':'')+'>'+String.fromCharCode(65+j)+') '+o+'</button>').join('');let fb=answered?'<div class="feedback show '+(picked[i]===q[3]?'good':'bad')+'">'+(picked[i]===q[3]?'✅ Correct!':'❌ Correct answer: '+String.fromCharCode(65+q[3])+'.')+' '+q[4]+'</div>':'';return '<section class="card"><div class="qnum">QUESTION '+(i+1)+' OF '+qs.length+'</div><div class="hi">'+q[0]+'</div><div class="en">'+q[1]+'</div><div class="opts">'+opts+'</div>'+fb+'</section>'}).join('');document.getElementById('score').textContent='Score: '+score()+' / '+qs.length}
function choose(i,j){if(picked[i]!==undefined)return;picked[i]=j;render();if(Object.keys(picked).length===qs.length){document.getElementById('result').style.display='block';document.getElementById('resultText').textContent='Your score: '+score()+' out of '+qs.length+'. Keep practising!'}}
function showAll(){qs.forEach((q,i)=>{if(picked[i]===undefined)picked[i]=-1});render()}
function resetQuiz(){picked={};document.getElementById('result').style.display='none';render();window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
